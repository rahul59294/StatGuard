[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "statguard"
version = "0.1.0"
description = "Local-first CSV profiling and statistical test selection CLI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "scipy>=1.13",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
statguard = "statguard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/statguard"]
